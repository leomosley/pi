[[screens]]
module = "clock"
duration_seconds = 30
renderer = "ansi"
glyphs = "ascii"

[screens.settings]
format = "24h"
show_seconds = true
transition_ms = 320

[[screens]]
module = "usage"
duration_seconds = 15
renderer = "ansi"

[screens.settings]
endpoint = "http://127.0.0.1:8787/usage"
refresh_seconds = 60
