[[screens]]
module = "clock"
duration_seconds = 30
renderer = "ansi"
glyphs = "ascii"

[screens.settings]
format = "24h"
show_seconds = true
transition_ms = 320

[[screens]]
module = "usage"
duration_seconds = 15
renderer = "ansi"

[screens.settings]
endpoint = "http://127.0.0.1:8787/usage"
refresh_seconds = 60

[[screens]]
module = "portfolio"
duration_seconds = 15
renderer = "ansi"
glyphs = "ascii"

[screens.settings]
refresh_seconds = 60
key_env = "TRADING_212_KEY_ID"
secret_env = "TRADING_212_SECRET"
env_file = "screens/portfolio/.env"

[[screens]]
module = "r6"
duration_seconds = 20
renderer = "ansi"

[screens.settings]
platform = "pc"
username = "mosly"
refresh_seconds = 300
