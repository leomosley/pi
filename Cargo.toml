[workspace]
members = ["apps/player", "crates/screen-api", "crates/ansi-renderer", "screens/clock", "screens/usage", "screens/portfolio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
font8x8 = "0.3"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"
thiserror = "2"
toml = "0.9"
vte = { version = "0.15", default-features = false }
ansi-renderer = { path = "crates/ansi-renderer" }
screen-api = { path = "crates/screen-api" }
screen-clock = { path = "screens/clock" }
screen-usage = { path = "screens/usage" }
screen-portfolio = { path = "screens/portfolio" }

[workspace.lints.rust]
# Slint's generated vtable macros allow their own unsafe internals. Deny unsafe
# in handwritten code without preventing those generated local overrides.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0
